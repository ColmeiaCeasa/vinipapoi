<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinicius Papoi - Typewriter</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: yellow;
      font-family: 'Courier New', Consolas, monospace; /* Fonte estilo código */
      font-size: 14px;
      line-height: 1.4;
      padding: 15px;
      box-sizing: border-box;
      height: 100vh;
      overflow: hidden; /* Impede barras de rolagem */
    }

    #terminal {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Bloco do cursor piscando estilo terminal */
    #cursor {
      display: inline-block;
      background-color: yellow;
      width: 8px;
      height: 15px;
      margin-left: 2px;
      vertical-align: middle;
      animation: piscar 0.7s infinite;
    }

    @keyframes piscar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <span id="terminal"></span><span id="cursor"></span>

  <script>
    const terminal = document.getElementById('terminal');
    const textoBase = "Vinicius Papoi ";
    let index = 0;

    function digitar() {
      // Calcula o limite de caracteres com base no tamanho da tela
      const limiteTela = Math.floor((window.innerWidth * window.innerHeight) / 90);

      if (terminal.textContent.length < limiteTela) {
        terminal.textContent += textoBase[index];
        index = (index + 1) % textoBase.length; // Loop no nome
        
        // Controla a velocidade da digitação (15ms = super fluido)
        setTimeout(digitar, 15); 
      }
    }

    digitar();
  </script>
</body>
</html>
