<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mural Animado Vinicius Papoi</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden; /* Impede a rolagem da página */
    }

    /* Contêiner para o texto repetido */
    #mural {
      color: yellow;
      font-family: sans-serif; /* Fonte limpa */
      font-size: 14px; /* Tamanho pequeno para preencher bem */
      line-height: 1.2; /* Espaçamento entre as linhas */
      text-align: justify; /* Justifica o texto para preencher as laterais */
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); /* Colunas automáticas */
      gap: 5px; /* Espaço entre cada bloco de texto */
      padding: 20px;
      width: 100vw;
      height: 100vh;
      overflow-y: auto; /* Permite rolagem se o texto for maior que a tela */
    }

    /* Estilo de cada letra animada */
    .letra-animada {
      display: inline-block; /* Necessário para aplicar transformações */
      animation: wave 1s infinite ease-in-out; /* Aplica a animação 'wave' */
      will-change: transform, color; /* Otimiza a animação */
    }

    /* Definição da animação de onda */
    @keyframes wave {
      0%, 100% {
        transform: translateY(0); /* Posição normal */
        color: yellow; /* Cor normal */
      }
      50% {
        transform: translateY(-5px); /* Sobe 5 pixels */
        color: lime; /* Muda sutilmente para verde-lima */
      }
    }
  </style>
</head>
<body>

  <div id="mural"></div>

  <script>
    const mural = document.getElementById('mural');
    const nomeBase = "Vinicius Papoi";
    const numeroDeCopias = 2000; // Ajuste conforme necessário

    for (let i = 0; i < numeroDeCopias; i++) {
      const containerNome = document.createElement('span');
      containerNome.style.whiteSpace = "nowrap"; // Impede o nome de quebrar

      // Loop para criar cada letra como um span individual para animar
      for (let j = 0; j < nomeBase.length; j++) {
        const letraSpan = document.createElement('span');
        letraSpan.className = 'letra-animada';
        letraSpan.textContent = nomeBase[j];

        // A mágica: calcula um atraso para cada letra para criar a onda
        const delay = (j + (i * nomeBase.length)) * 0.05; // 0.05s por letra
        letraSpan.style.animationDelay = `${delay}s`;

        containerNome.appendChild(letraSpan);
      }

      // Adiciona um espaço após o nome completo
      const espaço = document.createTextNode(" ");
      containerNome.appendChild(espaço);
      
      mural.appendChild(containerNome);
    }
  </script>
</body>
</html>
