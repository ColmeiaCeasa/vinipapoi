<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mural Vinicius Papoi</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden; /* Impede a rolagem da página */
    }

    /* Contêiner para o texto repetido */
    #mural {
      color: yellow;
      font-family: sans-serif; /* Fonte limpa */
      font-size: 14px; /* Tamanho pequeno para preencher bem */
      line-height: 1.2; /* Espaçamento entre as linhas */
      text-align: justify; /* Justifica o texto para preencher as laterais */
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); /* Colunas automáticas */
      gap: 5px; /* Espaço entre cada texto */
      padding: 20px;
      width: 100vw;
      height: 100vh;
      overflow-y: auto; /* Permite rolagem se o texto for maior que a tela */
    }

    .nome {
      white-space: nowrap; /* Impede que o nome se quebre em duas linhas */
    }
  </style>
</head>
<body>

  <div id="mural"></div>

  <script>
    const mural = document.getElementById('mural');
    const nome = "Vinicius Papoi";
    const numeroDeCopias = 5000; // Número de cópias para preencher a tela

    for (let i = 0; i < numeroDeCopias; i++) {
      const span = document.createElement('span');
      span.className = 'nome';
      span.textContent = nome;
      mural.appendChild(span);
    }
  </script>
</body>
</html>
